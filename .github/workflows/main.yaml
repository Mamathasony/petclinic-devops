name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # =========================
  # BUILD
  # =========================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven Validate
        run: mvn validate

      - name: Maven Compile
        run: mvn compile

      - name: Maven Test
        run: mvn test

      - name: Maven Package
        run: mvn package -DskipTests

      - name: Check WAR File
        run: |
          echo "Checking generated WAR file..."
          ls -lh target/
          ls target/*.war

      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-war
          path: target/*.war


  # =========================
  # DEV DEPLOYMENT
  # =========================
  deploy-dev:
    name: Deploy to DEV
    needs: build
    runs-on: ubuntu-latest
    environment: DEV

    steps:

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war

      - name: Deploy WAR to DEV using Curl
        run: |
          echo "Deploying WAR to DEV..."

          curl -v \
          -u "${{ secrets.DEV_USERNAME }}:${{ secrets.DEV_PASSWORD }}" \
          --upload-file *.war \
          "http://${{ secrets.DEV_HOST }}:8080/manager/text/deploy?path=/Petclinic&update=true"

          echo "DEV deployment completed."


  # =========================
  # TEST DEPLOYMENT
  # =========================
  deploy-test:
    name: Deploy to TEST
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: TEST

    steps:

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war

      - name: Deploy WAR to TEST using Curl
        run: |
          echo "Deploying WAR to TEST..."

          curl -v \
          -u "${{ secrets.TEST_USERNAME }}:${{ secrets.TEST_PASSWORD }}" \
          --upload-file *.war \
          "http://${{ secrets.TEST_HOST }}:8080/manager/text/deploy?path=/Petclinic&update=true"

          echo "TEST deployment completed."


  # =========================
  # PRE-PROD DEPLOYMENT
  # =========================
  deploy-preprod:
    name: Deploy to PRE-PROD
    needs: deploy-test
    runs-on: ubuntu-latest
    environment: PRE-PROD

    steps:

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war

      - name: Deploy WAR to PRE-PROD using Curl
        run: |
          echo "Deploying WAR to PRE-PROD..."

          curl -v \
          -u "${{ secrets.PREPROD_USERNAME }}:${{ secrets.PREPROD_PASSWORD }}" \
          --upload-file *.war \
          "http://${{ secrets.PREPROD_HOST }}:8080/manager/text/deploy?path=/Petclinic&update=true"

          echo "PRE-PROD deployment completed."


  # =========================
  # PROD DEPLOYMENT
  # =========================
  deploy-prod:
    name: Deploy to PROD
    needs: deploy-preprod
    runs-on: ubuntu-latest
    environment: PROD

    steps:

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war

      - name: Deploy WAR to PROD using Curl
        run: |
          echo "Deploying WAR to PROD..."

          curl -v \
          -u "${{ secrets.PROD_USERNAME }}:${{ secrets.PROD_PASSWORD }}" \
          --upload-file *.war \
          "http://${{ secrets.PROD_HOST }}:8080/manager/text/deploy?path=/Petclinic&update=true"

          echo "PROD deployment completed."
