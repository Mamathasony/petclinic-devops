name: CI/CD PIPELINE TO BUILD AND DEPLOY TO TOMCAT

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: validate with maven 
        run:  mvn validate
      - name: compile with maven
        run:   mvn compile 
      - name:  test with maven
        run:  mvn test
      - name: package with maven
        run:  mvn package
      - name: verify war file
        run: ls -lh target/ 
        
  # =========================
  # DEV
  # =========================
  deploy-dev:
    name: Deploy to DEV
    needs: build
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war

      - name: Copy WAR to DEV Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "*.war"
          target: "/opt/tomcat/webapps/"

      - name: Restart Tomcat on DEV
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl restart tomcat


  # =========================
  # TEST
  # =========================
  deploy-test:
    name: Deploy to TEST
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: TEST

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war

      - name: Copy WAR to TEST Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "*.war"
          target: "/opt/tomcat/webapps/"

      - name: Restart Tomcat on TEST
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl restart tomcat


  # =========================
  # PRE-PROD
  # =========================
  deploy-preprod:
    name: Deploy to PRE-PROD
    needs: deploy-test
    runs-on: ubuntu-latest
    environment: PRE-PROD

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war

      - name: Copy WAR to PRE-PROD Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PREPROD_HOST }}
          username: ${{ secrets.PREPROD_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "*.war"
          target: "/opt/tomcat/webapps/"

      - name: Restart Tomcat on PRE-PROD
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PREPROD_HOST }}
          username: ${{ secrets.PREPROD_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl restart tomcat


  # =========================
  # PROD
  # =========================
  deploy-prod:
    name: Deploy to PROD
    needs: deploy-preprod
    runs-on: ubuntu-latest
    environment: PROD

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war

      - name: Copy WAR to PROD Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "*.war"
          target: "/opt/tomcat/webapps/"

      - name: Restart Tomcat on PROD
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl restart tomcat
        
      
