name: CI/CD PIPELINE TO BUILD AND DEPLOY TO TOMCAT

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # =========================
  # BUILD
  # =========================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven Validate
        run: mvn validate

      - name: Maven Compile
        run: mvn compile

      - name: Maven Test
        run: mvn test

      - name: Maven Package
        run: mvn package

      - name: Verify WAR file
        run: ls -lh target/

      # IMPORTANT: Upload WAR so other jobs can download it
      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-war
          path: target/*.war


  # =========================
  # DEV
  # =========================
  deploy-dev:
    name: Deploy to DEV
    needs: build
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war

      - name: Copy WAR to DEV Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USERNAME }}
          key: ${{ secrets.DEV_SSH_KEY }}
          source: "*.war"
          target: "/root/apache-tomcat-9.0.121/webapps/"

      - name: Restart Tomcat on DEV
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USERNAME }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            cd /root/apache-tomcat-9.0.121
            ./bin/shutdown.sh || true
            sleep 5
            ./bin/startup.sh


  # =========================
  # TEST
  # =========================
  deploy-test:
    name: Deploy to TEST
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: TEST

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war

      - name: Copy WAR to TEST Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USERNAME }}
          password: ${{ secrets.TEST_PASSWORD }}
          source: "*.war"
          target: "/root/apache-tomcat-9.0.121/webapps/"

      - name: Restart Tomcat on TEST
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_HOST }}
          username: ${{ secrets.TEST_USERNAME }}
          password: ${{ secrets.TEST_PASSWORD }}
          script: |
            cd /root/apache-tomcat-9.0.121
            ./bin/shutdown.sh || true
            sleep 5
            ./bin/startup.sh


  # =========================
  # PRE-PROD
  # =========================
  deploy-preprod:
    name: Deploy to PRE-PROD
    needs: deploy-test
    runs-on: ubuntu-latest
    environment: PRE-PROD

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war

      - name: Copy WAR to PRE-PROD Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PREPROD_HOST }}
          username: ${{ secrets.PREPROD_USERNAME }}
          password: ${{ secrets.PREPROD_PASSWORD }}
          source: "*.war"
          target: "/root/apache-tomcat-9.0.121/webapps/"

      - name: Restart Tomcat on PRE-PROD
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PREPROD_HOST }}
          username: ${{ secrets.PREPROD_USERNAME }}
          password: ${{ secrets.PREPROD_PASSWORD }}
          script: |
            cd /root/apache-tomcat-9.0.121
            ./bin/shutdown.sh || true
            sleep 5
            ./bin/startup.sh


  # =========================
  # PROD
  # =========================
  deploy-prod:
    name: Deploy to PROD
    needs: deploy-preprod
    runs-on: ubuntu-latest
    environment: PROD

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war

      - name: Copy WAR to PROD Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          password: ${{ secrets.PROD_PASSWORD }}
          source: "*.war"
          target: "/root/apache-tomcat-9.0.121/webapps/"

      - name: Restart Tomcat on PROD
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          password: ${{ secrets.PROD_PASSWORD }}
          script: |
            cd /root/apache-tomcat-9.0.121
            ./bin/shutdown.sh || true
            sleep 5
            ./bin/startup.sh
